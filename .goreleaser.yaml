# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: imgx

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: imgx
    main: ./cmd/imgx
    binary: imgx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/priyojeet/imgx/internal/version.Version={{ .Version }}
      - -X github.com/priyojeet/imgx/internal/version.Commit={{ .Commit }}
      - -X github.com/priyojeet/imgx/internal/version.Date={{ .Date }}
    targets:
      - linux_amd64
      - linux_arm64
      - linux_riscv64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

release:
  preflight:
    fail_on_error: true

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
